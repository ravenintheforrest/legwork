# legwork registry — the fleet is config, not code.
# An agent is: what it does, what it may spend, which model runs it, and what it must produce.
# A loop is: what triggers it, what it may touch, and who gets told.

pack: packs/expo

defaults:
  model: claude-haiku-4-5-20251001     # cheap tier unless an agent earns better (per-agent routing)
  cost_ceiling_usd: 0.50               # per run; runner kills past this
  autonomy: propose                    # fix | propose | human

agents:
  discover:
    does: find repos and packages depending on Expo
    sources: [github_code_search, npm_dependents]
    output: candidates.jsonl
  discover-jobs:
    does: 'find companies hiring React Native / Expo engineers on public job boards — HN "Who is hiring?", Remotive, a web search through the Claude CLI with every hit re-fetched and verified, and a company''s own Greenhouse/Lever/Ashby board when we hold its exact URL'
    sources: [hn_algolia, remotive, web_search_cli, ats_boards]
    output: candidates.jsonl
    hypothesis: >
      public code search only sees repos, and the companies running Expo in production
      keep their app repos private — so the eas.json sweep returns mostly hobbyists.
      A job post naming Expo/EAS/React Native is production evidence and budget evidence
      in one public signal. Expect this channel to contribute the majority of net-new
      accounts that carry a company name and a domain, at the cost of arriving without
      repos: most will sit at discovered until a public org turns up.
  discover-issues:
    does: find companies whose engineers are opening issues on expo/expo and expo/eas-cli — production users with a pain this week
    sources: [github_issues, github_users]
    output: candidates.jsonl
    hypothesis: >
      an engineer who files an EAS issue and lists a company on their public profile is a
      production Expo user at that company, today. Expect fewer accounts than code search
      but a far higher share that are companies, and a reason to talk built in.
  discover-gitlab:
    does: probe GitLab public projects for Expo usage
    sources: [gitlab_projects]
    output: candidates.jsonl
    hypothesis: public mobile repos on GitLab are rare; expect near-zero marginal contribution.
    # This agent exists to be measured and, likely, retired — with data.
  resolve:
    does: repo -> org -> candidate company + domain
    sources: [github_orgs]
    output: accounts.jsonl
  enrich:
    does: company facts — what they do, size signals, careers page
    sources: [public_web]
    output: accounts.jsonl
  dedupe:
    does: reconcile duplicate orgs/domains, flag low-confidence records
    output: accounts.jsonl
  qualify:
    does: score production usage and segment (A mobile-first / B app-as-channel / C JS-forward org / D agency)
    signals: [production_evidence, store_links, ci_config, rn_version_recency, repo_activity, store_review_volume, store_update_cadence, hiring_signal]
    output: accounts.jsonl
  intent:
    does: recent signals — EAS/build issues, upgrade PRs, RN job posts
    sources: [github_issues, careers_pages, hn_algolia]
    output: signals.jsonl
  people:
    does: who to talk to — top contributors to the Expo repo and their public profiles
    sources: [github_contributors, github_users]
    output: accounts.jsonl
  brief:
    does: write the account brief — who, evidence, why now, suggested opener. Every claim carries its evidence URL.
    model: claude-opus-5                 # reasoning tier earns its keep here; frontier stays reserved
    cost_ceiling_usd: 2.00
    output: briefs/
  ops-brief:
    does: weekly — read the run log, report what the fleet did, what is degrading, what to retire
    schedule: weekly
    output: briefs/ops/

loops:
  eval:        { trigger: per_run,   gate: regression, golden_set: packs/expo/golden-set.jsonl }
  # confidence_gate moved with the 2026-08-23 reweight: a fully evidenced repo account with a
  # store app now lands at 0.75 before any hiring or regulated signal, so 0.80 queued nearly
  # everything. 0.70 publishes the well-evidenced and still queues the thin.
  review:      { trigger: daily,     cmd: legwork review, tracks: [acceptance_rate, edit_depth], confidence_gate: 0.70 }
  heal:        { trigger: run_error, cmd: legwork doctor, autonomy: propose, notify: console }
  improve:     { trigger: manual,    cmd: legwork improve, action: open_pr }   # the fleet PRs itself
  outcome:     { trigger: weekly,    source: outcomes, reweights: qualify.signals }
  retirement:  { trigger: monthly,   metric: marginal_contribution, candidate_threshold: 0.05 }

sources:
  outcomes:
    adapter: file                      # file | hubspot | clay_csv  (adapter behind one interface)
    path: fixtures/outcomes.jsonl
  notify:
    adapter: console                   # product-facing control plane; no implicit send-side action

autonomy_tiers:
  fix:     [retry_with_backoff, cache_invalidation, rate_limit_adjust]
  propose: [prompt_changes, signal_weight_changes, source_config]     # lands as a PR
  human:   [anything_touching_send, credentials, deleting_data, retiring_an_agent]
